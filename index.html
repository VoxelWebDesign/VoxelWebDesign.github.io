<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Voxel Web Design - Professional web design services and digital solutions.">
    <title>Voxel Web Design | Modern Digital Solutions</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a; /* Sleek dark blue/black */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #f8fafc;
        }
        .container {
            text-align: center;
            background: #1e293b;
            padding: 3rem;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            max-width: 600px;
            width: 90%;
            border: 1px solid #334155;
        }
        h1 { margin-bottom: 0.5rem; font-size: 2.5rem; color: #fff; }
        p { color: #94a3b8; font-size: 1.1rem; line-height: 1.6; }
        .btn {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 14px 32px;
            background-color: #38bdf8; /* Professional Blue */
            color: #0f172a;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 700;
            transition: transform 0.2s, background-color 0.2s;
        }
        .btn:hover { 
            background-color: #7dd3fc; 
            transform: translateY(-2px);
        }
        .footer { margin-top: 2rem; font-size: 0.85rem; color: #64748b; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Voxel Web Design</h1>
        <p>Expertly crafted digital experiences for the modern web.</p>
        
        <a href="https://voxelwebdesign.fourthwall.com" class="btn">View Our Services & Shop</a>

        <div class="footer">
            &copy; 2026 Voxel Web Design. All rights reserved. <br>
            Unauthorized duplication or use of this site's code is prohibited.
        </div>
    </div>

</body>
</html>
